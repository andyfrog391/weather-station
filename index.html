<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Lydney Weather & Aviation Station</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#07111f;--panel:#101d2d;--panel2:#142438;--line:#26384d;--text:#eaf2fb;--muted:#93a8bf;--cyan:#48c7e8;--green:#5bd49a;--amber:#ffca70}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;overflow:hidden}
body{padding:clamp(8px,1.2vw,20px);display:flex;flex-direction:column;gap:10px}
header{min-height:56px;padding-bottom:3px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#1e8db5,#2453a1);display:grid;place-items:center;font-size:22px}
h1{font-size:clamp(17px,2vw,25px);margin:0;letter-spacing:.04em}.sub{font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.headright{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.clock{text-align:right;font-variant-numeric:tabular-nums;margin-right:4px}.clock strong{display:block;font-size:20px}.clock span{font-size:11px;color:var(--muted)}
button{background:#1a3047;color:var(--text);border:1px solid #34516d;border-radius:9px;padding:8px 10px;font-weight:650;font-size:12px;cursor:pointer}
button:active{transform:scale(.98)}button.active{background:#16445a;border-color:var(--cyan);color:#dff9ff}
main{display:grid;grid-template-columns:1.04fr .96fr;gap:10px;flex:1;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.panelhead{padding:10px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);min-height:48px}
.paneltitle{font-weight:750;font-size:14px;letter-spacing:.04em}.eyebrow{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-top:2px}
.pill{font-size:10px;border:1px solid #31516b;color:#b9d8e9;padding:5px 8px;border-radius:99px;white-space:nowrap}
.layers{display:flex;gap:5px;flex-wrap:wrap}.layers button{padding:6px 8px;font-size:11px}
.mapwrap{position:relative;flex:1;min-height:170px;background:#0b1726}
#windy,#airmap{width:100%;height:100%;border:0;display:block;background:#0b1726}
.weatherstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 9px}
.stat{background:var(--panel2);border-radius:9px;padding:7px 9px;min-width:0}
.stat label{display:block;color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em}
.stat strong{display:block;font-size:clamp(13px,1.45vw,19px);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{font-size:10px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Aviation METAR strip */
.metarstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 9px 8px}
.mcard{background:#0d1a29;border:1px solid #20344b;border-radius:8px;padding:6px 8px;font-size:10.5px;min-width:0}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:2px}
.mhead b{font-size:11px;letter-spacing:.04em}
.fltcat{font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;letter-spacing:.04em}
.cat-VFR{background:#155734;color:#8ef5bd;border:1px solid #2da464}
.cat-MVFR{background:#163e69;color:#8cc8ff;border:1px solid #3584e4}
.cat-IFR{background:#6e1722;color:#ff9aa6;border:1px solid #d9384a}
.cat-LIFR{background:#5c1969;color:#f3a6ff;border:1px solid #b842cf}
.cat-UNK{background:#243547;color:#9fb3c8}
.mbody{color:#c5d6e7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msub{color:var(--muted);font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.night .metarstrip{display:none}

.aviationbody{display:grid;grid-template-rows:minmax(180px,1fr) minmax(110px,30%);flex:1;min-height:0;position:relative}
#airmap{min-height:180px}
.flightlist{border-top:1px solid var(--line);overflow:auto;padding:5px 9px}
.flightrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #203247;border-radius:0;padding:7px 5px}
.flightrow:last-child{border-bottom:0}.flightrow b{font-size:12px}.flightrow small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.flightrow .alt{font-size:11px;color:#c5d6e7;text-align:right}.flightrow .dist{font-size:10px;color:var(--cyan);min-width:48px;text-align:right}
.statusline{padding:6px 12px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
footer{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;padding:0 3px}
a{color:#9de6ff}.leaflet-container{font:12px system-ui}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#102033;color:#eaf2fb}.leaflet-popup-content{margin:10px 12px}
.plane-wrap{position:relative;width:30px;height:30px}.plane-wrap.mil .plane-icon{color:#ff1a1a}.plane-wrap.emg .plane-icon{color:#ffb000;animation:pulse .7s ease-in-out infinite alternate}
.ptag{position:absolute;left:50%;top:27px;transform:translateX(-50%);font:700 9px system-ui;letter-spacing:.04em;padding:1px 4px;border-radius:4px;color:#fff;background:#d90000;border:1px solid #fff;white-space:nowrap}.emg .ptag{background:#b36b00}.ptag.uav{background:#6b46c1}
@keyframes pulse{from{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #ffb000)}to{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 12px #ffb000)}}
@keyframes flash{50%{background:#ffb000;color:#1d1300}}
#emgBanner{display:none;align-items:center;justify-content:space-between;gap:10px;background:#c00020;color:#fff;font-weight:750;font-size:14px;padding:9px 13px;border-radius:10px;cursor:pointer;animation:flash 1.2s ease-in-out infinite}#emgBanner button{background:transparent;border:1px solid #fff8;color:inherit;padding:4px 9px}
.flightrow.mil{border-left:3px solid #ff1a1a;background:rgba(255,26,26,.09)}.flightrow.emg{border-left:3px solid #ffb000;background:rgba(255,176,0,.18)}
.milpill{background:#d90000;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;margin-right:3px}
.plane-icon{width:30px;height:30px;display:grid;place-items:center;color:#0044ff;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.modalback{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:10000;padding:16px}.modalback.open{display:flex}
.modal{width:min(440px,100%);background:#102033;border:1px solid #38516c;border-radius:16px;padding
