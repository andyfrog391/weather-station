<!DOCTYPE html>
<html lang="en">
<head>
 
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
 
<title>Lydney Weather & Aviation Station V2</title>
 
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
 
<style>
 
:root{
 
--bg:#020905;
--panel:#08150e;
--panel2:#0d2016;
 
--line:#245434;
 
--green:#8dff8d;
--green2:#56d956;
 
--text:#d8ffd8;
--muted:#83b083;
 
--red:#ff4a4a;
--amber:#ffca70;
 
}
 
*{
box-sizing:border-box;
margin:0;
padding:0;
}
 
html,
body{
width:100%;
height:100%;
background:var(--bg);
color:var(--text);
font-family:Segoe UI, Arial, sans-serif;
overflow:hidden;
}
 
body{
display:flex;
flex-direction:column;
}
 
header{
 
height:60px;
 
background:#051009;
 
border-bottom:1px solid var(--line);
 
display:flex;
align-items:center;
justify-content:space-between;
 
padding:0 15px;
}
 
.brand{
display:flex;
align-items:center;
gap:10px;
}
